<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System | DOM CRUD Application</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Header Section -->
        <header class="header">
            <h1>📚 Student Management System</h1>
            <p>Complete DOM CRUD Application with LocalStorage</p>
            <div class="stats-container" id="statsContainer">
                <div class="stat-card">
                    <div class="stat-number" id="totalStudents">0</div>
                    <div class="stat-label">Total Students</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="averageAge">0</div>
                    <div class="stat-label">Average Age</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="totalCourses">0</div>
                    <div class="stat-label">Courses</div>
                </div>
            </div>
        </header>

        <!-- Main Content - Flexbox Layout -->
        <div class="main-content">
            <!-- Left Side: Form Section -->
            <div class="form-section">
                <h2>✏️ Student Registration Form</h2>
                <form id="studentForm">
                    <div class="form-group">
                        <label for="studentId">Student ID (Auto-generated)</label>
                        <input type="text" id="studentId" readonly placeholder="Auto-generated">
                    </div>

                    <div class="form-group">
                        <label for="fullName">Full Name *</label>
                        <input type="text" id="fullName" placeholder="Enter student's full name" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="age">Age *</label>
                            <input type="number" id="age" placeholder="Age" min="1" max="120" required>
                        </div>
                        <div class="form-group">
                            <label for="gender">Gender *</label>
                            <select id="gender" required>
                                <option value="">Select Gender</option>
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address *</label>
                        <input type="email" id="email" placeholder="student@example.com" required>
                    </div>

                    <div class="form-group">
                        <label for="course">Course *</label>
                        <select id="course" required>
                            <option value="">Select Course</option>
                            <option value="Artificial Intelligence">Artificial Intelligence</option>
                            <option value="Web Development">Web Development</option>
                            <option value="Data Science">Data Science</option>
                            <option value="Python Programming">Python Programming</option>
                            <option value="JavaScript Mastery">JavaScript Mastery</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="address">Address</label>
                        <textarea id="address" placeholder="Enter student's address"></textarea>
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" placeholder="+92 XXX XXXXXXX">
                    </div>

                    <div class="button-group">
                        <button type="submit" class="btn btn-primary" id="saveBtn">
                            💾 Save Student
                        </button>
                        <button type="button" class="btn btn-secondary" id="updateBtn" style="display: none;">
                            🔄 Update Student
                        </button>
                        <button type="button" class="btn btn-danger" id="cancelBtn" style="display: none;">
                            ❌ Cancel
                        </button>
                        <button type="reset" class="btn btn-warning" id="resetBtn">
                            🗑️ Reset Form
                        </button>
                    </div>
                </form>
            </div>

            <!-- Right Side: Table Section -->
            <div class="table-section">
                <h2>📋 Student Records</h2>
                
                <!-- Search and Filter Bar -->
                <div class="search-bar">
                    <input type="text" id="searchInput" placeholder="🔍 Search by name, email, or course...">
                    <select id="filterCourse">
                        <option value="all">All Courses</option>
                        <option value="Artificial Intelligence">Artificial Intelligence</option>
                        <option value="Web Development">Web Development</option>
                        <option value="Data Science">Data Science</option>
                        <option value="Python Programming">Python Programming</option>
                        <option value="JavaScript Mastery">JavaScript Mastery</option>
                    </select>
                    <button class="btn btn-small" id="clearFilterBtn">Clear Filter</button>
                </div>

                <!-- Students Table -->
                <div class="table-wrapper">
                    <table id="studentTable">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Age</th>
                                <th>Gender</th>
                                <th>Email</th>
                                <th>Course</th>
                                <th>Phone</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="studentTableBody">
                            <tr class="empty-row">
                                <td colspan="8">No students found. Add your first student!</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Bulk Actions -->
                <div class="bulk-actions">
                    <button class="btn btn-danger" id="deleteAllBtn">
                        🗑️ Delete All Students
                    </button>
                    <button class="btn btn-primary" id="exportDataBtn">
                        📥 Export to Console
                    </button>
                    <button class="btn btn-warning" id="loadSampleBtn">
                        📚 Load Sample Data
                    </button>
                </div>
            </div>
        </div>

        <!-- Toast Notification -->
        <div id="toast" class="toast">
            <span id="toastMessage"></span>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
